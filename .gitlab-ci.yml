stages:
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

test:
  stage: test
  image: python:3.12

  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest

  script:
    - python -m pytest -vv

docker-build:
  stage: build
  image: docker:24

  services:
    - docker:24-dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  script:
    - docker build -t nairobi-transport-monitor .