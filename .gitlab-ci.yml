stages:
  - test
  - security
  - build

default:
  image: python:3.12

before_script:
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt

pytest:
  stage: test
  script:
    - python -m pytest -vv

bandit:
  stage: security
  script:
    - pip install bandit
    - bandit -r app

pip-audit:
  stage: security
  script:
    - pip install pip-audit
    - pip-audit

docker-build:
  stage: build
  image: docker:24

  services:
    - docker:24-dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  script:
    - docker build -t nairobi-transport-monitor .