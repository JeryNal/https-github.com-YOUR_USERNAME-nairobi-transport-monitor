<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nairobi Transport Monitor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container-fluid">
      <span class="navbar-brand fw-semibold">Nairobi Transport Monitor</span>
      <span class="badge text-bg-success" id="connectionStatus">Connecting</span>
    </div>
  </nav>

  <main class="container-fluid py-3">
    <section id="loginPanel" class="login-shell">
      <div class="login-panel border">
        <h1 class="h4 mb-3">Operator Login</h1>
        <form id="loginForm">
          <label class="form-label" for="username">Username</label>
          <input class="form-control mb-3" id="username" value="admin" autocomplete="username">
          <label class="form-label" for="password">Password</label>
          <input class="form-control mb-3" id="password" type="password" value="admin123" autocomplete="current-password">
          <button class="btn btn-primary w-100" type="submit">Sign in</button>
          <p class="text-danger small mt-3 mb-0" id="loginError"></p>
        </form>
      </div>
    </section>

    <section id="dashboard" class="dashboard d-none">
      <div class="row g-3">
        <div class="col-12 col-xl-9">
          <div id="map"></div>
        </div>
        <div class="col-12 col-xl-3">
          <div class="metrics-grid mb-3">
            <div class="metric border">
              <span>Total</span>
              <strong id="totalVehicles">0</strong>
            </div>
            <div class="metric border">
              <span>Active</span>
              <strong id="activeVehicles">0</strong>
            </div>
            <div class="metric border">
              <span>Avg Speed</span>
              <strong id="avgSpeed">0</strong>
            </div>
            <div class="metric border">
              <span>Avg Load</span>
              <strong id="avgOccupancy">0</strong>
            </div>
          </div>
          <div class="vehicle-list border">
            <div class="list-header">Vehicles</div>
            <div id="vehicleList"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
